spark.eventLog.enabled false
spark.sql.session.timeZone UTC
# Keep java.sql.Timestamp conversions (JDBC to ClickHouse) in UTC on driver and executors.
spark.driver.extraJavaOptions -Duser.timezone=UTC
spark.executor.extraJavaOptions -Duser.timezone=UTC
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
# Endpoint and credentials come from MINIO_* environment variables (spark_jobs.common.session).

# Small per-app footprint so 3 streaming jobs + 1 batch job fit on one worker
# (SPARK_WORKER_CORES=4, SPARK_WORKER_MEMORY=3g). Override per job with --conf.
spark.cores.max 1
spark.executor.memory 640m
spark.driver.memory 512m
spark.sql.shuffle.partitions 4
