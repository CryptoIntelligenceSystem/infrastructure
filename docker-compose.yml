x-spark-common: &spark-common
  build: ./spark
  restart: unless-stopped
  environment:
    SPARK_NO_DAEMONIZE: "true"
    HOME: /tmp
    SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
    SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-3g}
    # Spark job code lives in the data-pipeline repo, mounted read-only below.
    PYTHONPATH: /opt/pipeline
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_MARKET_TOPIC: market_data
    KAFKA_NEWS_TOPIC: news_data
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:-raw-data}
    MINIO_CHECKPOINT_BUCKET: ${MINIO_CHECKPOINT_BUCKET:-checkpoints}
    CLICKHOUSE_JDBC_URL: jdbc:clickhouse://clickhouse:8123/${CLICKHOUSE_DB}
    CLICKHOUSE_JDBC_DRIVER: ${CLICKHOUSE_JDBC_DRIVER:-com.clickhouse.jdbc.ClickHouseDriver}
    CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  volumes:
    # Requires the repos to be cloned side by side (../data-pipeline), or set PIPELINE_REPO_DIR.
    - ${PIPELINE_REPO_DIR:-../data-pipeline}:/opt/pipeline:ro
    - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: pipeline-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: pipeline-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic market_data --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic news_data --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: pipeline-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: pipeline-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9003:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro

  mc-init:
    # Creates the buckets Spark writes to. No shell in this image: credentials come from MC_HOST_local.
    image: chainguard/minio-client:latest@sha256:778b2dac231584d5d5749ab663f9f61979d60dd5c00abf682af888db6a9f46e4
    container_name: pipeline-mc-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: ["mb", "--ignore-existing", "local/${MINIO_RAW_BUCKET:-raw-data}", "local/${MINIO_CHECKPOINT_BUCKET:-checkpoints}"]
    restart: on-failure:10

  raw-sink:
    # Replaced by the Spark job raw_to_minio; kept for reference. Start with: docker compose --profile legacy up raw-sink
    profiles: ["legacy"]
    build: ./raw-sink
    container_name: pipeline-raw-sink
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: raw-sink-minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: raw-data

  spark-master:
    <<: *spark-common
    container_name: pipeline-spark-master
    hostname: spark-master
    depends_on:
      kafka:
        condition: service_healthy
      mc-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
    command: ["/opt/spark/sbin/start-master.sh"]
    # Jobs are submitted from this container (client mode), so their drivers live here too.
    mem_limit: ${SPARK_MASTER_MEM_LIMIT:-3g}
    cpus: ${SPARK_MASTER_CPUS:-2}
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040-4043:4040-4043"   # Spark UI of each running driver (first job 4040, next 4041, ...)

  spark-worker:
    <<: *spark-common
    container_name: pipeline-spark-worker
    hostname: spark-worker
    depends_on:
      spark-master:
        condition: service_started
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    mem_limit: ${SPARK_WORKER_MEM_LIMIT:-4g}
    cpus: ${SPARK_WORKER_CPUS:-4}
    ports:
      - "8081:8081"

volumes:
  kafka_data:
  minio_data:
  clickhouse_data:
  clickhouse_logs:
